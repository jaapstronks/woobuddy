name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Frontend — Vitest unit tests + type checking
  # ---------------------------------------------------------------------------
  frontend-unit:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # PUBLIC_API_URL is imported via `$env/static/public`, which requires
    # the variable to be present at build/check time. Real values come
    # from `frontend/.env` locally (git-ignored); in CI we pass a
    # placeholder so svelte-check can resolve the import.
    env:
      PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run check
      - run: npm run test

  # ---------------------------------------------------------------------------
  # Backend — pytest with PostgreSQL service container
  # ---------------------------------------------------------------------------
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: woobuddy
          POSTGRES_PASSWORD: woobuddy
          POSTGRES_DB: woobuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U woobuddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://woobuddy:woobuddy@localhost:5432/woobuddy_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"
      # Same list, same order as CONTRIBUTING.md "Checks die moeten slagen".
      # Keep the two in sync: instructions CI does not enforce are how a
      # broken tree merges green.
      - run: ruff check app/
      - run: ruff format --check app/
      - run: mypy app/
      - run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Images — build the production Docker images (build only, never push)
  # ---------------------------------------------------------------------------
  # Neither test suite touches backend/Dockerfile or frontend/Dockerfile: the
  # backend suite runs pytest on a 3.12 runner, independent of the image. So
  # when Dependabot lifted the base image to python:3.14-slim in #64, CI went
  # green on an image that no longer builds (`regex` ships no cp314 wheel and
  # the slim image has no gcc), every deploy since has died in the build step,
  # and production kept serving a four-month-old image. This job is the gate
  # that catches that class of breakage.
  #
  # No `targets:` — bake defaults to the compose file's default group, which is
  # exactly the services that declare a `build:` section. A future buildable
  # service is then covered without editing this file.
  images:
    name: Images build
    runs-on: ubuntu-latest

    # docker-compose.prod.yml interpolates this into the postgres service.
    # Nothing built here needs it, but compose warns on an unset variable.
    env:
      DBASE_PASSWORD: ci

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/bake-action@v7
        with:
          files: docker-compose.prod.yml
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
