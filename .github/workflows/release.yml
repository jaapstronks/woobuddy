name: Release images

# Triggered by pushing a tag that matches `v*` (e.g. `v0.1.0`, `v0.2.0-rc1`).
# Builds and pushes the API + frontend images to GHCR at the tag version.
#
# The GitHub Release itself is *not* made here: `release-please.yml` creates
# the tag and the Release when its Release PR is merged, changelog included.
# This workflow only reacts to the resulting tag. See
# docs/reference/versioning.md.
#
# Note that this only fires when the tag is pushed with a PAT
# (`RELEASE_PLEASE_TOKEN`); a tag pushed by the built-in `GITHUB_TOKEN`
# triggers no other workflows, so the images would silently not be built.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push ${{ matrix.image }} image
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: woobuddy-api
            context: ./backend
          - image: woobuddy-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v7

      # QEMU registers binfmt handlers so the amd64 GitHub-hosted runner can
      # also build the arm64 image. Without this the linux/arm64 leg of the
      # platforms matrix below fails with "exec format error".
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces both `:vX.Y.Z` (the tag itself) and `:latest` for stable
      # releases. Pre-release tags (e.g. `v0.2.0-rc1`) only get the version
      # tag, never `:latest`.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          # linux/arm64 covers Apple Silicon dev laptops and arm64 cloud
          # instances (Hetzner CAX, AWS Graviton, etc.) that increasingly
          # dominate the self-host audience. The arm64 leg builds under QEMU
          # emulation on the amd64 runner, ~2x slower but still under 5 min.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

